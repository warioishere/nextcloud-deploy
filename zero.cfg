###############################################
#                  zero.cfg                   #
#                -------------                #
#  Konfigurationsvariablen - bitte anpassen!  #
#  yourdevice.ch                              #
###############################################

NEXTCLOUDDATAPATH="/nc_data"
NEXTCLOUDADMINUSER="nextcloud"
NEXTCLOUDADMINUSERPASSWORD=$(openssl rand -hex 16)
NCRELEASE="latest.tar.bz2"
NEXTCLOUDDNS="ihre.clouddomain.de"
NCDBNAME="nextcloud"
NCDBUSER="nextcloud"
NCDBPASSWORD=$(openssl rand -hex 16)
MARIADBROOTPASSWORD=$(openssl rand -hex 16)
REDISPASSWORD=$(openssl rand -hex 16)
CURRENTTIMEZONE='Europe/Zurich'
PHONEREGION='CH'
NEXTCLOUDOFFICE="y"
ONLYOFFICE="n"
UPLOADSIZE='10G'
APTIP4="y"
RESOLVER="9.9.9.9 149.112.112.112"
REMOVEUAU="n"
ZFSMIRROR="ask"
ZFSDISKS=""
ZFSWIPE="n"
ZFSPOOL="ncpool"
NETMODE="ask"
DYNDNS_HOSTNAME=""
DYNDNS_KEY=""
DYNDNS_ZONE="yourdevice-cloud.ch"

#
#############################################################################
### ! DO NOT CHANGE ANYTHING FROM HERE ! //  ! KEINE ÄNDERUNGEN AB HIER ! ###
#############################################################################
#
#----------------------------------------------------------------------------
#
# Unterstützt: Ubuntu 26.04 LTS, amd64 und arm64 (Raspberry Pi 5:
# "Ubuntu Server 26.04 LTS (64-bit)" aus dem Raspberry Pi Imager)
# PHP ist die Version von Ubuntu (8.5).
#
# NEXTCLOUDDATAPATH="/nc_data"
# » Datenverzeichnis: wo sollen die Nextcloud Daten gespeichert werden
# » Bei einem ZFS-Mirror wird das Dataset hier eingehängt
# » Alternativ bspw.: NEXTCLOUDDATAPATH="/var/nc_data"

# NEXTCLOUDADMINUSER="nextcloud_ABC"
# » Lokaler Nextcloud Administrator
# » Alternativ bspw.: NEXTCLOUDADMINUSER="nc_admin"

# NEXTCLOUDADMINUSERPASSWORD=$(openssl rand -hex 16)
# » Passwort des lokalen Nextcloud Administrators
# » Alternativ bspw.: NEXTCLOUDADMINUSERPASSWORD="NeXtCLoUd-PwD"

# NCRELEASE="latest.tar.bz2"
# » Nextcloud Releases (https://download.nextcloud.com/server/releases/)
# » Alternativ bspw.: NCRELEASE="nextcloud-27.1.10.tar.bz2"

# NEXTCLOUDDNS="ihre.clouddomain.de"
# » Ihre Nextcloud Domain ohne http(s), für die ein Let's-Encrypt-Zertifikat
# » ausgestellt wird. Der DNS-Eintrag muss auf diese Maschine zeigen und Port 80
# » muss von aussen erreichbar sein.
# » Bei NETMODE="dyndns" wird stattdessen DYNDNS_HOSTNAME verwendet; das
# » Zertifikat wird dann über DNS bestätigt, es braucht keinen offenen Port.

# NCDBNAME="nextcloud"
# » Name der Datenbankinstanz ohne Sonderzeichen, Leerzeichen o.Ä.
# » Alternativ bspw.: NCDBNAME="nextcloudDBName"
# » wird immer konvertiert ("lowercases"):  NCDBNAME="${NCDBNAME,,}"

# NCDBUSER="nextcloud"
# » Name des Datenbankbenutzers ohne Sonderzeichen, Leerzeichen o.Ä.
# » Alternativ bspw.: NCDBUSER="nextcloudDBUser"
# » wird immer konvertiert ("lowercases"):  NCDBUSER="${NCDBUSER,,}"

# CURRENTTIMEZONE='Europe/Berlin'
# » Welche Zeitzone soll verwendet werden?
# » Alternativ bspw.: CURRENTTIMEZONE='Europe/Vienna'

# PHONEREGION='DE'
# » Welche Region (Sprache) soll für die Nextcloud Phone Region gesetzt werden?
# » Alternativ bspw.: PHONEREGION='AT'

# NEXTCLOUDOFFICE="n"
# ONLYOFFICE="n"
# » Soll Nextcloud Office und/oder OnlyOffice heruntergalden und aktiviert werden?
# » Alternativen bspw.: [y|n]
# » NEXTCLOUDOFFICE="y"
# » ONLYOFFICE="y"

# UPLOADSIZE='10G'
# » Welche max. PHP-Uploadgroesse soll eingestellt werden ('0' « kein Limit)?"
# » Alternativ bspw.: UPLOADSIZE='2G'

# APTIP4="n"
# » APT nur über IPv4 [y|n]
# » Alternativ bspw.: APTIP4="y"

# RESOLVER="176.9.93.198 176.9.1.117"
# » Webserver nutzt als DNS-Server: bspw. dnsforge.de (176.9.93.198 176.9.1.117)
# » Alternativ bspw.: RESOLVER="127.0.0.53"

# MARIADBROOTPASSWORD=$(openssl rand -hex 16)
# » MariaDB-Root-Passwort setzen,
# » bspw.: MARIADBROOTPASSWORD="MaRiAdB-RooT-PwD"
# » oder automatisch vom Skript generieren lassen
# » Alternativ bspw.: MARIADBROOTPASSWORD="Y.uJ4-!*öLolL"

# NCDBPASSWORD=nextcloud
# » Passwort des Datenbankbenutzers:
# » NCDBPASSWORD="YouR#P@ssworT" oder vom Skript generiert
# » Alternativ bspw.: NCDBPASSWORD=$(openssl rand -hex 16)

# REMOVEUAU="y"
# » Unattended-Upgrades werden entfernt [y|n]
# » Alternativ bspw.: REMOVEUAU="n"

# ZFSMIRROR="ask"
# » ZFS-Mirror für das Datenverzeichnis [ask|y|n]
# » ask: freie Disks gleicher Grösse werden erkannt und angeboten (nur wenn
# »      es mindestens zwei gibt; Boot-/Systemdisk wird nie angeboten)
# » y:   ohne Rückfrage aus den zwei Disks in ZFSDISKS
# » n:   kein ZFS
# ZFSDISKS="/dev/nvme0n1 /dev/nvme1n1"
# » Nur bei ZFSMIRROR="y": die zwei Disks für den Mirror
# ZFSWIPE="n"
# » Nur bei ZFSMIRROR="y": Disks mit Partitionen/Daten löschen [y|n]
# » (bei "ask" wird stattdessen interaktiv bestätigt)
# ZFSPOOL="ncpool"
# » Name des ZFS-Pools

# NETMODE="ask"
# » Öffentliche Erreichbarkeit [ask|static|dyndns]
# » static: feste öffentliche IP, der DNS-Eintrag für NEXTCLOUDDNS wird selbst gesetzt
# » dyndns: DynDNS über dyndns-api.yourdevice.ch; ein Timer hält den Eintrag aktuell.
# »         Die Maschine kann in jedem Netz mit Internet eingerichtet werden; am
# »         Zielort braucht sie nur die Weiterleitung von 443 (und 80 für die
# »         Umleitung auf https)
# DYNDNS_HOSTNAME="kunde1"
# » Hostname, kurz oder vollständig (kunde1 oder kunde1.yourdevice-cloud.ch)
# » leer = wird abgefragt
# DYNDNS_KEY=""
# » API-Key für genau diesen Hostnamen (von yourdevice.ch erhalten)
# » leer = wird verdeckt abgefragt; nicht in dieser Datei speichern, wenn
# » sie weitergegeben wird
# DYNDNS_ZONE="yourdevice-cloud.ch"
# » DNS-Zone der DynDNS-Hostnamen
#
#----------------------------------------------------------------------------
# yourdevice.ch
